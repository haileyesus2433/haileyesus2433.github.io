<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<script>
			// Runs before first paint so a saved theme never flashes the other one.
			// Without a saved choice, CSS follows prefers-color-scheme.
			(function () {
				var root = document.documentElement;
				root.classList.add('js');
				try {
					var theme = localStorage.getItem('theme');
					if (theme === 'light' || theme === 'dark') root.dataset.theme = theme;
				} catch (e) {}
			})();
		</script>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,500..600,50&family=JetBrains+Mono:wght@400;600&family=Source+Sans+3:ital,wght@0,400..600;1,400&display=swap"
		/>
		%sveltekit.head%
	</head>
	<body>
		<div style="display: contents">%sveltekit.body%</div>
		<script>
			// Theme toggle: the only script on the site.
			(function () {
				var root = document.documentElement;
				var button = document.getElementById('theme-toggle');
				if (!button) return;
				var dark = matchMedia('(prefers-color-scheme: dark)');
				function current() {
					var t = root.dataset.theme;
					if (t === 'light' || t === 'dark') return t;
					return dark.matches ? 'dark' : 'light';
				}
				function sync() {
					button.setAttribute('aria-pressed', String(current() === 'dark'));
				}
				button.addEventListener('click', function () {
					root.dataset.theme = current() === 'dark' ? 'light' : 'dark';
					try {
						localStorage.setItem('theme', root.dataset.theme);
					} catch (e) {}
					sync();
				});
				dark.addEventListener('change', sync);
				sync();
			})();
		</script>
	</body>
</html>
