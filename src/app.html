<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<script>
			// Runs before first paint so a saved theme never flashes the other one.
			// Without a saved choice, CSS follows prefers-color-scheme.
			(function () {
				var root = document.documentElement;
				root.classList.add('js');
				try {
					var theme = localStorage.getItem('theme');
					if (theme === 'light' || theme === 'dark') root.dataset.theme = theme;
				} catch (e) {}
			})();
		</script>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,500..600,50&family=JetBrains+Mono:wght@400;600&family=Source+Sans+3:ital,wght@0,400..600;1,400&display=swap"
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
